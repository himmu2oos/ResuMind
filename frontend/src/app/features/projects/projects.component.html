<div class="page">
  <h1>Projects</h1>
  <p class="subtitle">Things I've built — from side projects to production apps</p>
  <div class="filters">
    <button *ngFor="let c of categories" [class.active]="selected === c" (click)="filter(c)">{{ c }}</button>
  </div>
  <div class="grid">
    <div class="card" *ngFor="let p of filtered">
      <div class="top">
        <span>📁</span>
        <div class="links">
          <a *ngIf="p.githubUrl" [href]="p.githubUrl" target="_blank">Code ↗</a>
          <a *ngIf="p.liveUrl" [href]="p.liveUrl" target="_blank">Demo ↗</a>
        </div>
      </div>
      <h3>{{ p.name }}</h3>
      <p>{{ p.description }}</p>
      <div class="meta">
        <span class="cat">{{ p.category }}</span>
        <span class="stars" *ngIf="p.stars">⭐ {{ p.stars }}</span>
      </div>
      <div class="tech"><span *ngFor="let t of p.techStack">{{ t }}</span></div>
    </div>
  </div>
  <div class="empty" *ngIf="filtered.length === 0">No projects in this category yet.</div>
</div>
